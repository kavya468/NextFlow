name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: nextflow_test
          POSTGRES_PASSWORD: integration_only
          POSTGRES_DB: nextflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextflow_test -d nextflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CLERK_TELEMETRY_DISABLED: "1"
      # Public, nonfunctional build fixture; no Clerk secret or live account.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate the local Prisma client (no database connection)
        run: pnpm db:generate
      - name: Install media decoders for security regression tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint baseline, security boundaries, and source tests
        run: >-
          pnpm exec eslint eslint.config.mjs vitest.config.ts
          'app/api/upload/**/*.ts' 'app/api/webhooks/fal/**/*.ts'
          lib/fal-webhook.ts lib/request-body.ts lib/safe-fetch.ts
          lib/upload-policy.ts lib/upload-client.ts lib/transloadit-url.ts
          lib/webhook-signing.ts lib/credits/credit-service.ts lib/credits/billing-policy.ts
          lib/services/execution-graph.ts lib/services/workflow-service.ts
          lib/services/node-inputs.ts lib/services/execution-state.ts lib/services/run-recovery.ts
          lib/nodes/handles.ts lib/nodes/structured-inputs.ts lib/nodes/registry.ts
          hooks/save-coordinator.ts
          lib/ui-config.ts lib/edge-geometry.ts vitest.integration.config.ts
          '**/*.{test,spec}.{ts,tsx}' --max-warnings 0
      - name: Unit and mocked integration tests
        run: pnpm test
      - name: Test migrations and accounting against isolated PostgreSQL
        env:
          DATABASE_URL: postgresql://nextflow_test:integration_only@127.0.0.1:5432/nextflow_test
          DIRECT_URL: postgresql://nextflow_test:integration_only@127.0.0.1:5432/nextflow_test
        run: |
          pnpm db:migrate
          pnpm test:integration
      - name: Production build (no migrations or provider credentials)
        run: pnpm build
      - name: Report existing application lint debt
        id: lint-debt
        if: always()
        continue-on-error: true
        run: pnpm exec eslint . --format json --output-file eslint-report.json
      - name: Preserve full lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eslint-report
          path: eslint-report.json
          if-no-files-found: ignore
      - name: Explain the temporary lint gate
        if: always()
        run: |
          echo 'Typecheck, source tests, baseline/security/test lint, and build are blocking checks. Full application lint is reported separately while pre-existing source debt is repaired; a green checks job does not mean the application is lint-clean.' >> "$GITHUB_STEP_SUMMARY"
